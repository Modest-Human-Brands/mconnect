$kind: http-request
description: |-
  Sends an email from the organization's connected mailbox. Pass accountId to choose a specific account (see List email accounts); otherwise the first connected one is used. The org comes from the x-org-id header.
url: '{{base_url}}/api/interaction/email/send'
method: POST
headers:
  Content-Type: application/json
  x-org-id: '{{org_id}}'
body:
  type: json
  content: |-
    {
        "userId": "368ee3b0289a8066818fc6994958263e",
        "contactId": "36dee3b0289a818ca9ecca3c28ad9855",
        "accountId": "00000000-0000-0000-0000-000000000000",
        "template": "internship-completion-certificate",
        "variables": {
            "recipient": {
                "name": "Alex Mercer",
                "role": "Senior Marketing Intern"
            },
            "scopeOfWork": "Digital Campaign Management",
            "startDate": "June 1, 2025",
            "endDate": "December 31, 2025",
            "dateOfIssue": "2025-09-04",
            "signerName": "Sarah Jenkins",
            "signerTitle": "Director of Marketing",
            "certificateUrl": "https://redcatpictures.com",
            "tracking": {
                "emailId": "test-certificate-1",
                "baseUrl": "http://localhost:5100"
            },
            "organization": {
                "id": "red-cat-pictures",
                "name": "RED CAT PICTURES",
                "website": "https://redcatpictures.com",
                "branding": {
                    "logo": "https://redcatpictures.com/logo-dark.svg",
                    "color": {
                        "primary": "#CD2D2D",
                        "accent": ""
                    },
                    "font": "Exo 2"
                },
                "socials": {}
            }
        }
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 12000
