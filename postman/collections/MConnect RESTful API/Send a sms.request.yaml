$kind: http-request
description: |-
  Sends an SMS to a contact's phone (or to recipientPhone). The organization comes from the x-org-id header.
url: '{{base_url}}/api/interaction/sms/send'
method: POST
headers:
  Content-Type: application/json
  x-org-id: '{{org_id}}'
body:
  type: json
  content: |-
    {
        "userId": "368ee3b0289a8066818fc6994958263e",
        "contactId": "36dee3b0289a818ca9ecca3c28ad9855",
        "template": "internship-completion-certificate",
        "variables": {
            "recipient": {
                "name": "Alex Mercer",
                "role": "Backend Core Systems Development"
            },
            "certificateUrl": "https://document.modesthumanbrands.com/api/document/4dd38bbf-8372-4a4b-a1c7-6f70d904f73e/content?download=true",
            "organization": {
                "id": "red-cat-pictures",
                "name": "RED CAT PICTURES",
                "website": "https://redcatpictures.com",
                "branding": {
                    "logo": "https://redcatpictures.com/logo-dark.svg",
                    "color": {
                        "primary": "#CD2D2D",
                        "accent": ""
                    },
                    "font": "Exo 2"
                },
                "socials": {}
            }
        }
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 15000
