$kind: http-request
description: Verifies an IMAP login and an SMTP handshake, then saves the account. On failure returns 400 with a readable statusMessage.
url: '{{base_url}}/api/email/accounts/imap'
method: POST
headers:
  Content-Type: application/json
  x-org-id: '{{org_id}}'
body:
  type: json
  content: |-
    {
        "fromName": "Modest Human Brands",
        "fromEmail": "hello@modesthumanbrands.com",
        "imapHost": "imap.hostinger.com",
        "imapPort": 993,
        "smtpHost": "smtp.hostinger.com",
        "smtpPort": 465,
        "user": "hello@modesthumanbrands.com",
        "pass": "<mailbox-password>"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 2000
