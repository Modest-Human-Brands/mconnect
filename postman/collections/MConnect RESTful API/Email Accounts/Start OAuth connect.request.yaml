$kind: http-request
description: Returns the provider consent URL as { url }. Open it in a browser; the provider then calls the callback route, which saves the account and redirects to "redirect" (a relative path or a URL on the connect origin).
url: '{{base_url}}/api/email/accounts/oauth/:provider/start?redirect=/settings/email'
method: GET
headers:
  x-org-id: '{{org_id}}'
queryParams:
  - key: redirect
    value: /settings/email
pathVariables:
  provider: google
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 3000
