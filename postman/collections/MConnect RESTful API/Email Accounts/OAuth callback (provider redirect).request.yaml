$kind: http-request
description: Called by Google or Microsoft after consent, never by a client. It needs a one-time state issued by the start route, so it cannot be exercised standalone. Redirects to the saved redirect; on failure the redirect gets ?emailError=<message>.
url: '{{base_url}}/api/email/accounts/oauth/:provider/callback?code=<code>&state=<state>'
method: GET
queryParams:
  - key: code
    value: <code>
  - key: state
    value: <state>
pathVariables:
  provider: google
order: 4000
