$kind: http-request
description: Lists the organization's connected mailboxes. Credentials and tokens are never returned.
url: '{{base_url}}/api/email/accounts'
method: GET
headers:
  x-org-id: '{{org_id}}'
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 1000
