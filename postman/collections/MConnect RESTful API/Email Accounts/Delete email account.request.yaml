$kind: http-request
description: Removes a stored account. Returns 204, or 404 for an unknown id.
url: '{{base_url}}/api/email/accounts/:id'
method: DELETE
headers:
  x-org-id: '{{org_id}}'
pathVariables:
  id: 00000000-0000-0000-0000-000000000000
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 204", function () {
          pm.response.to.have.status(204);
      });
    language: text/javascript
order: 5000
