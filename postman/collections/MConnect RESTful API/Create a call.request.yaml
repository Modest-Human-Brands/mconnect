$kind: http-request
description: |-
  Starts a dual-leg LiveKit call between a user and a contact. The organization comes from the x-org-id header.
url: '{{base_url}}/api/interaction/phone/send'
method: POST
headers:
  Content-Type: application/json
  x-org-id: '{{org_id}}'
body:
  type: json
  content: |-
    {
        "userId": "307ee3b0289a8179a8a8d2efcdb67bbf",
        "contactId": "366ee3b0289a81e59557e36826164832",
        "recordCall": true,
        "webCall": false
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 201", function () {
          pm.response.to.have.status(201);
      });
    language: text/javascript
order: 18000
